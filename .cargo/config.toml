[target.'cfg(all(target_arch = "arm", target_os = "none"))']
runner = ["ectf", "flash"]
# runner = "probe-rs run --restore-unwritten --verify --chip MSPM0L2228 --protocol=swd"
rustflags = [
	"-C",
	"link-arg=-Tlink.x",
	"-C",
	"link-arg=-Tdevice.x",
	"-C",
	"link-arg=-Tdefmt.x",
	"-C",
	"link-arg=-Tinterrupt_group.x",
    "-C",
    "link-arg=-Map=output.map"
]

[build]
target = "thumbv6m-none-eabi"

[env]
DEFMT_LOG = "trace"
